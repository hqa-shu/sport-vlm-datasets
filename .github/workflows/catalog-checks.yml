name: Catalog checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate catalog and generated outputs
        run: |
          python catalog.py --validate
          python generate_catalogs.py --check
      - name: Test tools and synthetic manifest
        run: |
          python -m unittest discover -s tests -v
          python manifest.py example-manifest.jsonl
